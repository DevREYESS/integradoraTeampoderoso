<div class="modal-backdrop" (click)="close.emit()"></div>

<div class="custom-modal-container">

  <button class="custom-modal-close-btn" (click)="close.emit()">&times;</button>

  <div #pdfContent class="pt-2 px-3 rounded"> 
    <h3 class="modal-header">
      <i class="modal-icon"></i> 
      Detalle de tu Cita
    </h3>
    <div class="btn-success mb-2 no-print">
<button type="button" class="btn btn-secondary  align-items-center " (click)="descargarPDF()">
  <i class="bi bi-file-earmark-arrow-down"></i>
  Descargar PDF
</button>
</div>
    <div class="appointment-details mb-1">
      <div class="detail-row" style="justify-content: center;">
        <h3 class="modal-header" style="font-weight: bold;">Medica Isor</h3>
      </div>

      <div class="detail-row">
        <span class="detail-label">Paciente:</span>
        <span class="detail-value">{{ appointmentData.nombrePaciente }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Estatus:</span>
        <span class="detail-value status-{{ statusInfo.class }}">{{ statusInfo.text }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Fecha:</span>
        <span class="detail-value">{{ formattedDate }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Hora:</span>
        <span class="detail-value">{{ appointmentTime }} - {{ appoendmentTime }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Doctor:</span>
        <span class="detail-value">{{ especialista }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Ubicación:</span>
        <span class="detail-value text-xs">{{ ubicacion }}</span>
      </div>
    </div>
    <div class="detail-value2"><span class="detail-value2">{{ mensaje }}</span></div>
    
    <button class="custom-modal-button primary-button" (click)="close.emit()">Aceptar</button>
  </div>

</div>
