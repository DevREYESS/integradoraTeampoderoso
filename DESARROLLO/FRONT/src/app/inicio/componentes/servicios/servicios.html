<div class="rounded-4 p-4">
  <div class="acciones-servicios">
    <button class="font-bold" (click)="abrirAgregarServicioModal()">
      <i class="pi pi-plus"></i> Nuevo Servicio
    </button>
  </div>

  <!-- SECCIÓN DE FILTROS -->
  <div class="filtros-container mt-4 p-4 bg-gray-50 rounded-xl border border-gray-200">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
      <!-- Filtro por Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input
          type="text"
          [(ngModel)]="filtros.nombreServicio"
          (keyup.enter)="aplicarFiltrosAlServicio()"
          placeholder="Buscar por nombre..."
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <!-- Filtro por Duración -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Duración (min)</label>
        <input
          type="number"
          [(ngModel)]="filtros.duracion"
          (keyup.enter)="aplicarFiltrosAlServicio()"
          placeholder="Ej: 30"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <!-- Filtro por Color -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
        <select
          [(ngModel)]="filtros.color"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 selectColor"
        >
          <option value="">Todos los colores</option>
          <option *ngFor="let color of coloresDisponibles" [value]="color" [style.background]="color"></option>
        </select>
        
        <!-- Preview del color seleccionado -->
        <!--
        <div *ngIf="filtros.color" class="mt-2 flex items-center gap-2">
          <span class="text-xs text-gray-600">Color seleccionado:</span>
          <span
            [style.background]="filtros.color"
            class="w-6 h-6 rounded-full border border-gray-300 inline-block"
          ></span>
        </div> -->
      </div>

      <!-- Botones de Acción -->
      <div class="flex gap-2">
        <button
          (click)="aplicarFiltrosAlServicio()"
          class="h-10 flex-1 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-3 transition font-medium"
        >
          <i class="pi pi-search mr-2"></i>
          Buscar
        </button>
        
        <button
          (click)="limpiarFiltros()"
          class="h-10 flex flex-row flex-1 px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-3 transition font-medium"
        >
          <i class="pi pi-filter-slash mt-1 mr-2"></i>
          Limpiar
        </button>
      </div>
    </div>
  </div>

  <div class="mt-4 max-h-[90vw] overflow-auto border border-gray-200 rounded-xl">
    <table class="w-full bg-white text-sm">
      <thead class="bg-gray-100 text-gray-700 uppercase text-xs font-semibold sticky top-0 z-10">
      <tr>
        <th class="px-4 py-2 text-left">Nombre del servicio</th>
        <th class="px-4 py-2 text-left">Duración</th>
        <th class="px-4 py-2 text-left">Color</th>
        <th class="px-4 py-2 text-center">Acciones</th>
      </tr>
      </thead>

      <tbody class="divide-y divide-gray-200">
      <tr
        *ngFor="let s of getPaginatedServicios()"
        class="hover:bg-gray-50 transition-colors"
      >
        <td class="px-4 py-2 text-gray-800">
          {{ s.nombreServicio }}
        </td>

        <td class="px-4 py-2 text-gray-700">
          {{ s.duracion }} min
        </td>

        <td class="px-4 py-2">
          <span
            [style.background]="s.color"
            class="w-4 h-4 rounded-full border border-gray-300 inline-block"
          ></span>
        </td>

        <td class="px-4 py-2 flex items-center justify-center gap-3">
          <i
            class="pi pi-trash text-red-500 hover:text-red-600 cursor-pointer text-base transition"
            (click)="abrirModalEliminar(s)"
            title="Eliminar"
          ></i>

          <i
            class="pi pi-pencil text-blue-500 hover:text-blue-600 cursor-pointer text-base transition"
            (click)="abrirEditarServicioModal(s)"
            title="Editar"
          ></i>
        </td>
      </tr>
      
      <!-- Mensaje cuando no hay resultados -->
      <tr *ngIf="servicios.length === 0">
        <td colspan="4" class="px-4 py-8 text-center text-gray-500">
          <i class="pi pi-search text-3xl mb-2"></i>
          <p>No se encontraron servicios con los filtros aplicados</p>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- 🩷 PAGINADO -->
  <div class="pagination-container" *ngIf="totalPages > 1">
    <button (click)="prevPage()" [disabled]="currentPage === 1"><</button>
    <span>Página {{ currentPage }} de {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages">></button>
  </div>
</div>

<app-editar-servicio
  *ngIf="showEditarServicioModal"
  [servicioSeleccionado]="servicioAEditar"
  [modo]="modoModal"
  (close)="cerrarEditarServicioModal()"
  (servicioActualizado)="manejarServicioActualizado($event)"
  (servicioAgregado)="manejarServicioAgregado($event)">
</app-editar-servicio>

<div *ngIf="showDeleteModal">
  <div class="modal-backdrop-small2" (click)="cancelarEliminacion()"></div>

  <div class="custom-modal-container-small2" (click)="$event.stopPropagation()">
    <div class="modal-header-small">Confirmar eliminación</div>

    <div class="custom-modal-message">
      ¿Deseas eliminar el servicio <b>{{ servicioAEliminar?.nombreServicio }}</b>?
    </div>

    <div class="custom-modal-actions">
      <button class="custom-modal-button danger" (click)="confirmarEliminarServicio()">Sí, eliminar</button>
      <button class="custom-modal-button" (click)="cancelarEliminacion()">No</button>
    </div>

    <button class="custom-modal-close-btn" (click)="cancelarEliminacion()">&times;</button>
  </div>
</div>
