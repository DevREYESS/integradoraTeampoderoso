<div class="modal-backdrop" (click)="close.emit()"></div>

<div class="custom-modal-container">
  <button class="custom-modal-close-btn" (click)="close.emit()">&times;</button>

  <div class="mx-auto bg-white p-4 rounded"> 
    <h3 class="modal-header">Selecciona un mes</h3>
   
    <div class="appointment-details">
      <div class="months-grid">
        <button *ngFor="let month of months" (click)="selectMonth(month)">
          {{ month.nombre }}
        </button>
      </div>
    </div>
  </div>
</div>
