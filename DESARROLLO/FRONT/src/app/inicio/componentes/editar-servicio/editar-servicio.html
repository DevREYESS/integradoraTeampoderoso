<div class="modal-overlay" (click)="cancelar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3 class="modal-title">{{ modo === 'editar' ? 'Editar servicio' : 'Nuevo servicio' }}</h3>
      <button class="close-button" (click)="cancelar()">&times;</button>
    </div>

    <form class="modal-form" (ngSubmit)="guardar()">
      <div class="form-group">
        <label>Servicio</label>
        <input 
          type="text" 
          class="custom-select"
          [(ngModel)]="servicioEditado.nombreServicio"
          name="nombreServicio"
          required>
      </div>

      <div class="form-group">
        <label>Estatus</label>
        <select class="custom-select" [(ngModel)]="servicioEditado.estatus" name="estatus">
          <option *ngFor="let estatus of opcionesEstatus" [value]="estatus">{{ estatus }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Duración</label>
        <select class="custom-select" [(ngModel)]="servicioEditado.duracion" name="duracion">
          <option *ngFor="let duracion of opcionesDuracion" [value]="duracion">{{ duracion }} minutos</option>
        </select>
      </div>

      <div class="form-group">
        <label>Prioridad</label>
        <select class="custom-select" [(ngModel)]="servicioEditado.prioridad" name="prioridad">
          <option value="Alta">Alta</option>
          <option value="Media">Media</option>
          <option value="Baja">Baja</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="cancel-button" (click)="cancelar()">CANCELAR</button>
        <button type="submit" class="save-button">{{ modo === 'editar' ? 'GUARDAR' : 'CREAR' }}</button>
      </div>
    </form>
  </div>
</div>
