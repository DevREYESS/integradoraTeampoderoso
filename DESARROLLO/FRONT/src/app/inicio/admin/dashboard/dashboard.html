<div class="flex h-screen bg-gradient-to-br from-pink-50 to-rose-50">
  <!-- Sidebar -->
  <aside
    [class]="sidebarOpen ? 'w-64' : 'w-22 md:w-22'"
    class="bg-gradient-to-b from-fuchsia-300 to-pink-400 text-white transition-all duration-300 ease-in-out overflow-hidden flex flex-col shadow-2xl"
  >
    <!-- Logo -->
    <div class="p-6 flex items-center justify-between border-b border-pink-100">
      <div class="flex items-center space-x-2 overflow-hidden">
        <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center flex-shrink-0">
          <img src="assets/imagenes/logo.jpg" alt="Médica Isor" class="rounded-5 cursor-pointer" (click)="toggleSidebar()">
        </div>
        <span
          [ngClass]="sidebarOpen ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-4'"
          class="text-xl font-bold whitespace-nowrap transition-all duration-300 ease-in-out">
      Médica Isor
    </span>
      </div>
    </div>

    <!-- Menu Items -->
    <nav class="flex-1 p-4 space-y-2">
      <a
        style="text-decoration: none"
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="bg-white text-pink-600 shadow-lg transform scale-105"
        [routerLinkActiveOptions]="{ exact: item.id === 'dashboard' }"
        (click)="setActiveMenu(item.id)"
        class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 text-pink-100 hover:bg-pink-500 hover:text-white cursor-pointer"
      >
        <i class="{{item.icon}}"></i>
        <span *ngIf="sidebarOpen" class="font-semibold ">{{ item.name }}</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden p-3 bg-zinc-100">
    <div class="card-body rounded-4 h-auto w-auto" >
      <router-outlet></router-outlet>
    </div>
</div>
</div>
